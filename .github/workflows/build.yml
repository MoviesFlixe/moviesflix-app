name: Build MoviesFlix Official Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python & Image Processing
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Initialize Android App Project
        run: |
          mkdir -p www
          cp -r app/* www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.moviesflix.app",
            "appName": "MoviesFlix",
            "webDir": "www",
            "backgroundColor": "#06080e",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android

      - name: Fix Kotlin BOM Dependency Conflict
        run: |
          sed -i '/dependencies {/a \    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")' android/app/build.gradle

      - name: Setup Official Adaptive Launcher Icons & Dark Splash
        run: |
          python3 -c "
          import urllib.request, os
          from PIL import Image

          url = 'https://i.ibb.co/TpHBH9m/file-00000000f1908208a1295719135a47e2.png'
          urllib.request.urlretrieve(url, 'app_icon.png')
          img = Image.open('app_icon.png').convert('RGBA')

          sizes = [
              ('mipmap-mdpi', 48),
              ('mipmap-hdpi', 72),
              ('mipmap-xhdpi', 96),
              ('mipmap-xxhdpi', 144),
              ('mipmap-xxxhdpi', 192)
          ]

          res_dir = 'android/app/src/main/res'
          for folder, s in sizes:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              
              # Square Icon
              resized = img.resize((s, s), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              
              # Round Icon
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              
              # Adaptive Foreground
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
          
          # Splash screen image setup
          splash_dir = os.path.join(res_dir, 'drawable')
          os.makedirs(splash_dir, exist_ok=True)
          splash_img = img.resize((256, 256), Image.Resampling.LANCZOS)
          splash_img.save(os.path.join(splash_dir, 'splash.png'))
          print('Adaptive Icons and Splash Generated!')
          "

      - name: Generate Production Keystore & Sign APK
        run: |
          # Generate a standard secure release keystore
          keytool -genkeypair -v -keystore release.keystore -alias moviesflix -keyalg RSA -keysize 2048 -validity 10000 -storepass moviesflix123 -keypass moviesflix123 -dname "CN=MoviesFlix, OU=Mobile, O=MoviesFlixCompany, L=Global, S=World, C=US"
          
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          
          # Find jarsigner and sign the release APK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore -storepass moviesflix123 -keypass moviesflix123 $APK_PATH moviesflix
          
          # Align APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $APK_PATH app/build/outputs/apk/release/MoviesFlix-v1.0.0.apk || cp $APK_PATH app/build/outputs/apk/release/MoviesFlix-v1.0.0.apk

      - name: Upload Official Production APK
        uses: actions/upload-artifact@v4
        with:
          name: MoviesFlix-v1.0.0-APK
          path: android/app/build/outputs/apk/release/MoviesFlix-v1.0.0.apk
