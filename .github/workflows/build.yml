name: Build MoviesFlix Official Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python & Image Tools
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Initialize Android App Project
        run: |
          mkdir -p www
          cp -r app/* www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.moviesflix.app",
            "appName": "MoviesFlix",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: Fix Kotlin Duplicate Class Conflict
        run: |
          # Inject Kotlin BOM constraint into android/app/build.gradle to prevent duplicate classes
          sed -i '/dependencies {/a \    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")' android/app/build.gradle

      - name: Setup Custom App Logo Icons
        run: |
          python3 -c "
          import urllib.request, os
          from PIL import Image

          url = 'https://i.ibb.co/TpHBH9m/file-00000000f1908208a1295719135a47e2.png'
          urllib.request.urlretrieve(url, 'app_icon.png')
          img = Image.open('app_icon.png').convert('RGBA')

          sizes = [
              ('mipmap-mdpi', 48),
              ('mipmap-hdpi', 72),
              ('mipmap-xhdpi', 96),
              ('mipmap-xxhdpi', 144),
              ('mipmap-xxxhdpi', 192)
          ]

          res_dir = 'android/app/src/main/res'
          for folder, s in sizes:
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((s, s), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
          print('Icons generated successfully!')
          "

      - name: Build Official Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: MoviesFlix-v1.0.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
