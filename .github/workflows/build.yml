name: Build MoviesFlix Official Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize Android App Project
        run: |
          mkdir -p www
          cp -r app/* www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MoviesFlix com.moviesflix.app --web-dir www
          npx cap add android

      - name: Setup Custom App Logo Icons
        run: |
          curl -sL "https://i.ibb.co/TpHBH9m/file-00000000f1908208a1295719135a47e2.png" -o app_icon.png
          
          # Generate All Android Mipmap App Icon Sizes
          RES_DIR="android/app/src/main/res"
          convert app_icon.png -resize 48x48 "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert app_icon.png -resize 72x72 "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert app_icon.png -resize 96x96 "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert app_icon.png -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert app_icon.png -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"

          # Round Icons
          convert app_icon.png -resize 48x48 "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
          convert app_icon.png -resize 72x72 "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
          convert app_icon.png -resize 96x96 "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
          convert app_icon.png -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          convert app_icon.png -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: Build Official Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: MoviesFlix-v1.0.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
